<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sudoku štafeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1055; --muted:#7a5aa6; --card:rgba(255,255,255,.88); --line:#e4d3fb;
  --pink:#ff4fa3; --cyan:#22d3ee; --yellow:#ffe14d; --purple:#8b5cf6; --mint:#2dd4a0; --bad:#ff2e63;
  --given:#efe4ff; --hard:4px 4px 0 var(--ink);
  --sans:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#a78bfa}
body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.4;min-height:100dvh;position:relative;overflow-x:hidden;
  background:linear-gradient(180deg,#7dd3fc 0%,#c4b5fd 38%,#ff9ad5 72%,#ffc4a3 100%) fixed;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;left:50%;bottom:22vh;width:min(70vw,320px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(180deg,#fff27a 0%,#ff9ad5 60%,#ff4fa3 100%);opacity:.75;z-index:0}
body::after{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:24vh;z-index:0;
  background:linear-gradient(#2b1055,#2b1055) top/100% 3px no-repeat,
    repeating-linear-gradient(90deg,transparent 0 38px,rgba(34,211,238,.9) 38px 40px),
    repeating-linear-gradient(0deg,transparent 0 28px,rgba(34,211,238,.9) 28px 30px),#3b1a7a;
  transform:perspective(220px) rotateX(48deg);transform-origin:top;opacity:.9}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:14px}
h1{font:800 clamp(2.2rem,10vw,3rem)/1.02 var(--sans);margin:10px 0 0;color:#fff;letter-spacing:-.01em;
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--ink)}
.rules{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;box-shadow:var(--hard);font-size:1.05rem;font-weight:500}
.rules p{margin:0}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);background:#fff;color:var(--ink);padding:12px 16px;border-radius:18px;font-weight:600;
  box-shadow:var(--hard);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
button.primary{background:var(--pink);color:#fff;text-shadow:2px 2px 0 var(--ink)}
button.small{padding:8px 14px;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.7);box-shadow:3px 3px 0 var(--ink)}
.big{font-size:1.4rem;padding:18px;width:100%;border-radius:24px}
label{font-weight:600;color:var(--ink);font-size:1rem;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:2px 10px;display:inline-block}
input.name{font:600 1.4rem var(--sans);width:100%;padding:14px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);margin-top:10px;box-shadow:var(--hard);-webkit-user-select:text;user-select:text}
.sec{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 14px;box-shadow:4px 4px 0 var(--pink)}
.top .tn{font:600 .95rem var(--sans);color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34%}
.time{font:700 1.9rem/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--cyan);text-shadow:0 0 12px rgba(34,211,238,.8)}
.time small{font-size:.55em;color:var(--pink)}
.steps{display:flex;gap:6px}
.dot{width:16px;height:16px;border:3px solid #fff;border-radius:50%}
.dot.ok{background:var(--mint);border-color:var(--mint)}
.dot.now{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.pz{font:700 1.2rem var(--sans);text-align:center;color:var(--ink);text-shadow:2px 2px 0 rgba(255,255,255,.7)}

.board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;background:#fff;border-radius:22px;overflow:hidden;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.c{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:0;margin:0;background:#fff;
  font:600 clamp(1.15rem,5.8vw,1.75rem)/1 var(--sans);display:flex;align-items:center;justify-content:center;color:#e0158a;min-width:0;transition:none}
.c:active{transform:none;box-shadow:none}
.c.g{color:var(--ink);font-weight:700;background:var(--given)}
.c.rb{border-right:3px solid var(--ink)}
.c.bb{border-bottom:3px solid var(--ink)}
.c.sel{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 3px var(--pink);z-index:1}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{font-size:1.5rem;padding:12px 0;font-weight:700;border-radius:16px;box-shadow:3px 3px 0 var(--ink);background:#2f7cf6;color:#fff}
.pad button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

.over{position:fixed;inset:0;background:linear-gradient(160deg,rgba(139,92,246,.97),rgba(255,79,163,.96));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10}
.over h2{font:700 clamp(1.9rem,8.5vw,2.8rem)/1.1 var(--sans);margin:0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.over p{font-size:1.2rem;margin:0;font-weight:500;max-width:22em}
.over .n{font:700 7rem/1 var(--sans);margin-top:8px;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);font-variant-numeric:tabular-nums}

.final{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--mint);padding:22px 18px;text-align:center}
.final span{display:block;font-weight:600}
.final strong{display:block;font:700 clamp(3rem,16vw,4.8rem)/1.1 var(--sans);color:#e0158a;font-variant-numeric:tabular-nums;margin:8px 0 0;text-shadow:3px 3px 0 var(--cyan)}
.laps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lap{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);padding:10px 4px;text-align:center;font-size:.9rem;color:var(--muted);font-weight:500}
.lap b{display:block;font-size:1.2rem;color:var(--ink);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <section class="sec" id="s-setup" hidden>
    <h1>Sudoku štafeta</h1>
    <div class="rules">
      <p><strong>Soutěž probíhá jako štafeta – člen týmu dokončí sudoku a další z týmu poté přebírá štafetu a zahajuje další sudoku.</strong></p>
    </div>
    <div>
      <label for="name">Příjmení vedoucího skupiny</label>
      <input class="name" id="name" maxlength="30" placeholder="např. Novák" autocomplete="off">
    </div>
    <button class="primary big" id="start">Start – zobrazit 1. sudoku</button>
  </section>

  <section class="sec" id="s-run" hidden>
    <div class="top">
      <span class="tn" id="tn"></span>
      <span class="time" id="time">00:00.0</span>
      <span class="steps" id="steps"></span>
    </div>
    <div class="pz" id="pz"></div>
    <div class="board" id="board" role="grid" aria-label="Sudoku"></div>
    <div class="pad" id="pad"></div>
    <div class="row"><button class="small" id="reset">Vynulovat</button></div>
  </section>

  <section class="sec" id="s-done" hidden>
    <div class="pz" id="dteam"></div>
    <div class="final">
      <span>ČAS DOKONČENÍ VŠECH 3 SUDOKU:</span>
      <strong id="dtime"></strong>
    </div>
    <div class="laps" id="laps"></div>
    <div class="row"><button class="small" id="reset2">Vynulovat</button></div>
  </section>
</div>

<div class="over" id="over" hidden>
  <h2 id="oh"></h2>
  <p id="op"></p>
  <div class="n" id="on"></div>
</div>

<script>
const PUZ = [{"p": "860009003491302500503040910000280090930010702048960030100800079300700050070000024", "s": "867159243491372568523648917715283496936415782248967135154826379382794651679531824"}, {"p": "056410030000700500800560902400006008000290003235000640600035470070021006019600200", "s": "956412837123789564847563912491356728768294153235178649682935471574821396319647285"}, {"p": "000029000250040370090030000900010200027005903600970500000764102402803006006000045", "s": "763129458251648379894537621945316287127485963638972514589764132412853796376291845"}];
const TOTAL = PUZ.length, KEY = 'sudoku-stafeta-v3', HANDOVER = 5;
const $ = id => document.getElementById(id);
let S = fresh(), now = Date.now(), sel = -1, holdUntil = 0;

function fresh(){ return {name:'', start:null, splits:[], grids:PUZ.map(p=>p.p)}; }
try{
  const s = JSON.parse(localStorage.getItem(KEY));
  if(s && Array.isArray(s.splits) && Array.isArray(s.grids) && s.grids.length===TOTAL) S = s;
}catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const done = () => S.splits.length >= TOTAL;
const elapsed = () => done() ? S.splits[TOTAL-1] : (S.start===null ? 0 : now - S.start);
function fmt(ms){
  const t = Math.max(0, Math.floor(ms/100)), d = t%10, s = Math.floor(t/10)%60, m = Math.floor(t/600);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;
}
const fmtHTML = ms => { const f = fmt(ms); return f.slice(0,-2)+'<small>'+f.slice(-2)+'</small>'; };

/* ---- sudoku logika ---- */
function conflicts(g){
  const bad = new Set();
  const groups = [];
  for(let i=0;i<9;i++){
    groups.push([...Array(9)].map((_,k)=>i*9+k));
    groups.push([...Array(9)].map((_,k)=>k*9+i));
    const br=Math.floor(i/3)*3, bc=(i%3)*3;
    groups.push([...Array(9)].map((_,k)=>(br+Math.floor(k/3))*9+bc+k%3));
  }
  for(const grp of groups){
    const seen = {};
    for(const idx of grp){ const v = g[idx]; if(v==='0') continue; (seen[v] = seen[v] || []).push(idx); }
    for(const v in seen) if(seen[v].length>1) seen[v].forEach(i=>bad.add(i));
  }
  return bad;
}

function renderBoard(){
  const k = S.splits.length, g = S.grids[k], given = PUZ[k].p;
  const b = $('board');
  if(b.children.length!==81){
    b.innerHTML = '';
    for(let i=0;i<81;i++){
      const c = document.createElement('button');
      c.type='button'; c.dataset.i = i;
      c.setAttribute('role','gridcell');
      c.setAttribute('aria-label','Řádek '+(Math.floor(i/9)+1)+', sloupec '+(i%9+1));
      b.appendChild(c);
    }
  }
  for(let i=0;i<81;i++){
    const c = b.children[i], r=Math.floor(i/9), cl=i%9;
    const isG = given[i]!=='0';
    let cls = 'c';
    if(isG) cls += ' g';
    if(cl===2||cl===5) cls += ' rb';
    if(r===2||r===5) cls += ' bb';
    if(i===sel) cls += ' sel';
    c.className = cls;
    c.textContent = g[i]==='0' ? '' : g[i];
  }
}

function setCell(v){
  if(sel<0 || done()) return;
  const k = S.splits.length;
  if(PUZ[k].p[sel]!=='0') return;
  const g = S.grids[k];
  if(g[sel]===v) return;
  S.grids[k] = g.slice(0,sel)+v+g.slice(sel+1);
  save(); renderBoard(); checkSolved();
}

function checkSolved(){
  const k = S.splits.length;
  if(S.grids[k] !== PUZ[k].s) return;
  now = Date.now();
  S.splits.push(now - S.start);
  sel = -1; save();
  if(done()){ render(); return; }
  holdUntil = now + HANDOVER*1000;
  showHandover(k);
}

/* ---- předání štafety (automaticky, bez klepání) ---- */
function showHandover(k){
  const lap = S.splits[k] - (k ? S.splits[k-1] : 0);
  $('oh').textContent = 'Sudoku '+(k+1)+' hotovo ('+fmt(lap)+')';
  $('op').textContent = 'Předejte zařízení dalšímu členovi. Čas běží dál.';
  $('over').hidden = false;
  render();
  const t = setInterval(()=>{
    const left = Math.ceil((holdUntil - Date.now())/1000);
    if(left<=0){ clearInterval(t); $('over').hidden = true; render(); }
    else $('on').textContent = left;
  }, 200);
  $('on').textContent = HANDOVER;
}

/* ---- vykreslení ---- */
function render(){
  const team = S.name || 'Skupina';
  const screen = S.start===null ? 'setup' : done() ? 'done' : 'run';
  ['setup','run','done'].forEach(n => $('s-'+n).hidden = n !== screen);
  if(screen==='setup') $('name').value = S.name;
  if(screen==='run'){
    $('tn').textContent = team;
    const k = S.splits.length;
    $('pz').textContent = 'Sudoku '+(k+1)+' ze '+TOTAL;
    $('steps').innerHTML = PUZ.map((_,i)=>`<span class="dot ${i<k?'ok':i===k?'now':''}"></span>`).join('');
    renderBoard();
  }
  if(screen==='done'){
    $('dteam').textContent = team;
    $('dtime').textContent = fmt(S.splits[TOTAL-1]);
    $('laps').innerHTML = S.splits.map((s,i)=>`<div class="lap">Sudoku ${i+1}<b>${fmt(s-(i?S.splits[i-1]:0))}</b></div>`).join('');
    $('over').hidden = true;
  }
  keepAwake(screen==='run');
}

function tick(){
  now = Date.now();
  if(S.start!==null && !done()) $('time').innerHTML = fmtHTML(elapsed());
  requestAnimationFrame(tick);
}

let lock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !lock){
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', ()=>{ lock = null; });
    }else if(!on && lock){ await lock.release(); lock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && S.start!==null && !done()) keepAwake(true);
});

/* ---- ovládání ---- */
$('board').addEventListener('click', e=>{
  const c = e.target.closest('.c'); if(!c) return;
  sel = +c.dataset.i; renderBoard();
});
$('pad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-v="${n}">${n}</button>`).join('')
  + `<button type="button" class="er" data-v="0" aria-label="Smazat">⌫</button>`;
$('pad').addEventListener('click', e=>{
  const b = e.target.closest('button[data-v]'); if(b) setCell(b.dataset.v);
});
document.addEventListener('keydown', e=>{
  if($('s-run').hidden || e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)) setCell(e.key);
  else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0') setCell('0');
  else if(sel>=0 && e.key.startsWith('Arrow')){
    e.preventDefault();
    const d = {ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];
    const r = Math.floor(sel/9), c = sel%9;
    if((e.key==='ArrowLeft'&&c===0)||(e.key==='ArrowRight'&&c===8)||(e.key==='ArrowUp'&&r===0)||(e.key==='ArrowDown'&&r===8)) return;
    sel += d; renderBoard();
  }
});

$('start').onclick = () => {
  S = fresh();
  S.name = $('name').value.trim() || 'Skupina';
  S.start = Date.now(); now = S.start;
  save(); render();
};
let armed = null;
const doReset = () => { S = fresh(); sel = -1; $('over').hidden = true; save(); render(); };
const reset = e => {
  const b = e.currentTarget;
  if(armed === b){ clearTimeout(b._t); armed = null; b.textContent = 'Vynulovat'; doReset(); return; }
  if(armed){ clearTimeout(armed._t); armed.textContent = 'Vynulovat'; }
  armed = b; b.textContent = 'Opravdu? Klepni znovu';
  b._t = setTimeout(()=>{ b.textContent = 'Vynulovat'; if(armed===b) armed = null; }, 3000);
};
$('reset').onclick = $('reset2').onclick = reset;

render();
tick();
</script>
</body>
</html>
